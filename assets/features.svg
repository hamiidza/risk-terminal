<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="520" viewBox="0 0 1280 520" role="img" aria-labelledby="t">
  <title id="t">Feature overview</title>
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2dd4bf"/><stop offset="1" stop-color="#6366f1"/></linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#172033"/><stop offset="1" stop-color="#0f1520"/></linearGradient>
    <g id="c"><rect width="396" height="206" rx="16" fill="url(#card)" stroke="#94a3b8" stroke-opacity=".22"/><rect x="0" y="0" width="396" height="3" rx="1.5" fill="url(#g)"/></g>
  </defs>
  <rect width="1280" height="520" rx="22" fill="#0b1018"/>
  <g font-family="Segoe UI,Helvetica,Arial,sans-serif">
    <g transform="translate(32 32)"><use href="#c"/>
      <text x="24" y="52" font-size="20" font-weight="700" fill="#e8edf5">Risk-based sizing</text>
      <text x="24" y="86" font-size="14" fill="#8b98ad">Quantity from risk budget and stop distance.</text>
      <text x="24" y="108" font-size="14" fill="#8b98ad">Rounded down to the lot step, never up.</text>
      <text x="24" y="130" font-size="14" fill="#8b98ad">Fees and slippage can sit inside the risk.</text>
      <text x="24" y="176" font-size="13" font-family="ui-monospace,Menlo,Consolas,monospace" fill="#2dd4bf">Q = R / (s + costs)</text></g>
    <g transform="translate(442 32)"><use href="#c"/>
      <text x="24" y="52" font-size="20" font-weight="700" fill="#e8edf5">Leverage &amp; margin guard</text>
      <text x="24" y="86" font-size="14" fill="#8b98ad">Leverage above your cap is blocked.</text>
      <text x="24" y="108" font-size="14" fill="#8b98ad">Size is reduced with a warning when margin</text>
      <text x="24" y="130" font-size="14" fill="#8b98ad">is short. Liquidation shown as an estimate.</text>
      <text x="24" y="176" font-size="13" font-family="ui-monospace,Menlo,Consolas,monospace" fill="#2dd4bf">margin = notional / L</text></g>
    <g transform="translate(852 32)"><use href="#c"/>
      <text x="24" y="52" font-size="20" font-weight="700" fill="#e8edf5">Costs, line by line</text>
      <text x="24" y="86" font-size="14" fill="#8b98ad">Maker/taker fees, slippage and funding.</text>
      <text x="24" y="108" font-size="14" fill="#8b98ad">Gross and net risk, reward and R:R are</text>
      <text x="24" y="130" font-size="14" fill="#8b98ad">shown separately and reconcile exactly.</text>
      <text x="24" y="176" font-size="13" font-family="ui-monospace,Menlo,Consolas,monospace" fill="#2dd4bf">net = gross - fees - slip - fund</text></g>
    <g transform="translate(32 262)"><use href="#c"/>
      <text x="24" y="52" font-size="20" font-weight="700" fill="#e8edf5">Drawdown protection</text>
      <text x="24" y="86" font-size="14" fill="#8b98ad">New trades are blocked at the equity floor.</text>
      <text x="24" y="108" font-size="14" fill="#8b98ad">Risk is clamped to the remaining buffer,</text>
      <text x="24" y="130" font-size="14" fill="#8b98ad">with a visible warning. Daily limits too.</text>
      <text x="24" y="176" font-size="13" font-family="ui-monospace,Menlo,Consolas,monospace" fill="#2dd4bf">floor = E0 * (1 - maxDD)</text></g>
    <g transform="translate(442 262)"><use href="#c"/>
      <text x="24" y="52" font-size="20" font-weight="700" fill="#e8edf5">Planner &amp; Monte Carlo</text>
      <text x="24" y="86" font-size="14" fill="#8b98ad">Interactive 30 to 500 trade planner, compound</text>
      <text x="24" y="108" font-size="14" fill="#8b98ad">or fixed risk. Seeded, reproducible simulation</text>
      <text x="24" y="130" font-size="14" fill="#8b98ad">with percentile bands. Hypothetical, not a forecast.</text>
      <text x="24" y="176" font-size="13" font-family="ui-monospace,Menlo,Consolas,monospace" fill="#2dd4bf">mulberry32(seed)</text></g>
    <g transform="translate(852 262)"><use href="#c"/>
      <text x="24" y="52" font-size="20" font-weight="700" fill="#e8edf5">Journal &amp; analytics</text>
      <text x="24" y="86" font-size="14" fill="#8b98ad">Editable manual trade journal, expectancy,</text>
      <text x="24" y="108" font-size="14" fill="#8b98ad">profit factor, drawdown and streaks.</text>
      <text x="24" y="130" font-size="14" fill="#8b98ad">CSV export protected from formula injection.</text>
      <text x="24" y="176" font-size="13" font-family="ui-monospace,Menlo,Consolas,monospace" fill="#2dd4bf">E = p*W - (1-p)*L</text></g>
    <text x="640" y="494" text-anchor="middle" font-size="14" fill="#8b98ad">Persian RTL and English  |  Dark and light themes  |  Responsive  |  Works offline from one HTML file</text>
  </g>
</svg>
