<!doctype html>
<html lang="fa" dir="rtl" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Risk &amp; Reward Terminal</title>
<style>:root{
  --bg:#070a10;--bg2:#0b1018;--p:#0f1520;--p2:#151d2b;--p3:#1b2536;--b:rgba(148,163,184,.14);--b2:rgba(148,163,184,.26);
  --t:#e8edf5;--m:#8b98ad;--ac:#2dd4bf;--ac2:#6366f1;--g:#34d399;--r:#fb7185;--a:#fbbf24;--bl:#818cf8;
  --grad:linear-gradient(135deg,#2dd4bf 0%,#6366f1 100%);--on-ac:#03120f;--rad:14px;--sh:0 1px 0 rgba(255,255,255,.04) inset,0 10px 30px -14px rgba(0,0,0,.7);
  --mono:ui-monospace,"SF Mono","Cascadia Mono","JetBrains Mono",Consolas,monospace;color-scheme:dark}
[data-theme=light]{
  --bg:#eef1f7;--bg2:#e6eaf2;--p:#ffffff;--p2:#f3f5fa;--p3:#e9edf5;--b:rgba(15,23,42,.1);--b2:rgba(15,23,42,.2);
  --t:#0f172a;--m:#56627a;--ac:#0d9488;--ac2:#4f46e5;--g:#059669;--r:#e11d48;--a:#b45309;--bl:#4f46e5;
  --on-ac:#ffffff;--sh:0 1px 2px rgba(15,23,42,.06),0 12px 28px -16px rgba(15,23,42,.25);color-scheme:light}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;color:var(--t);font:14px/1.6 system-ui,"Segoe UI",Tahoma,"Noto Sans Arabic",Arial,sans-serif;
  background:radial-gradient(900px 480px at 85% -10%,rgba(99,102,241,.16),transparent 60%),radial-gradient(800px 420px at -5% 5%,rgba(45,212,191,.12),transparent 60%),var(--bg);background-attachment:fixed}
button{font:inherit}
.shell{display:grid;grid-template-columns:252px minmax(0,1fr);min-height:100vh}
/* sidebar */
.side{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:18px;padding:20px 14px;border-inline-end:1px solid var(--b);background:linear-gradient(180deg,rgba(255,255,255,.03),transparent),var(--bg2)}
.logo{display:flex;align-items:center;gap:11px;padding:0 6px}
.logo svg{width:42px;height:42px;flex:0 0 auto;filter:drop-shadow(0 6px 14px rgba(99,102,241,.45))}
.brand{display:flex;flex-direction:column;min-width:0}.brand b{font-size:14.5px;line-height:1.35}.brand span{color:var(--m);font-size:11px;direction:ltr;text-align:start;unicode-bidi:plaintext}
#nav{display:flex;flex-direction:column;gap:3px;flex:1}
#nav button{display:flex;align-items:center;gap:11px;padding:10px 12px;border:0;border-radius:11px;background:transparent;color:var(--m);cursor:pointer;text-align:start;position:relative;transition:background .15s,color .15s}
#nav button svg{width:19px;height:19px;flex:0 0 auto;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#nav button:hover{background:var(--p2);color:var(--t)}
#nav button.on{background:linear-gradient(90deg,rgba(45,212,191,.16),rgba(99,102,241,.1));color:var(--t);font-weight:600;box-shadow:0 0 0 1px var(--b) inset}
#nav button.on::before{content:"";position:absolute;inset-block:9px;inset-inline-start:-14px;width:3px;border-radius:3px;background:var(--grad)}
#nav button.on svg{stroke:var(--ac)}
.tools{display:flex;gap:8px}
.tools button{flex:1;padding:8px 10px;border-radius:10px;border:1px solid var(--b);background:var(--p2);color:var(--t);cursor:pointer;transition:border-color .15s}
.tools button:hover{border-color:var(--ac)}
.wrap{min-width:0;padding:18px 22px 48px;max-width:1360px;width:100%}
.banner{padding:10px 14px;border:1px solid color-mix(in srgb,var(--a) 45%,transparent);border-radius:12px;background:color-mix(in srgb,var(--a) 8%,transparent);font-size:12.5px;margin-bottom:16px;color:var(--t)}
main section{animation:rise .28s ease both}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
/* controls */
.btn{padding:9px 15px;border-radius:10px;border:1px solid var(--b2);background:var(--p2);color:var(--t);cursor:pointer;transition:transform .12s,border-color .15s,box-shadow .15s}
.btn:hover:not(:disabled){border-color:var(--ac);transform:translateY(-1px)}.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.pri{background:var(--grad);border-color:transparent;color:#fff;font-weight:650;box-shadow:0 8px 20px -10px rgba(99,102,241,.8)}
.btn.danger{color:var(--r)}.btn.sm{padding:2px 9px}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
input,select{width:100%;padding:9px 11px;background:var(--p2);color:var(--t);border:1px solid var(--b);border-radius:10px;font:inherit;min-width:0;transition:border-color .15s,box-shadow .15s}
input:hover,select:hover{border-color:var(--b2)}
input:focus,select:focus{border-color:var(--ac);box-shadow:0 0 0 3px color-mix(in srgb,var(--ac) 22%,transparent);outline:none}
input[type=checkbox]{width:18px;height:18px;accent-color:var(--ac)}
.f{display:flex;flex-direction:column;gap:5px;margin:0 0 11px}.f>span{color:var(--m);font-size:12.5px}
.f.chk{flex-direction:row;align-items:center;gap:9px}.f.chk>span{color:var(--t)}
.lbl{color:var(--m);font-size:12px;margin:8px 0 5px;text-transform:uppercase;letter-spacing:.04em}
.seg{display:flex;padding:3px;gap:3px;border:1px solid var(--b);border-radius:12px;background:var(--p2);margin:0 0 11px}
.seg button{flex:1;padding:7px 8px;background:transparent;color:var(--m);border:0;border-radius:9px;cursor:pointer;transition:all .15s}
.seg button.on{background:var(--grad);color:#fff;font-weight:650;box-shadow:0 4px 12px -6px rgba(99,102,241,.9)}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
/* cards */
.card{background:linear-gradient(180deg,rgba(255,255,255,.035),rgba(255,255,255,.01)),var(--p);border:1px solid var(--b);border-radius:var(--rad);padding:16px;margin-bottom:14px;min-width:0;box-shadow:var(--sh)}
.card.ok{border-color:color-mix(in srgb,var(--g) 50%,var(--b))}.card.bad{border-color:var(--r)}
.card h2{margin:0 0 12px;font-size:14px;font-weight:650;display:flex;gap:8px;align-items:center;flex-wrap:wrap;letter-spacing:.01em}
.card h2:not(:first-child){margin-top:18px}
.cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px;align-items:start}
#tab-calc>.cols{grid-template-columns:minmax(270px,350px) minmax(0,1fr)}
#tab-calc .cols .cols{grid-template-columns:1fr 1fr}
.cols3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;align-items:start}
.row2,.row3,.row4{display:grid;gap:10px}.row2{grid-template-columns:1fr 1fr}.row3{grid-template-columns:repeat(3,1fr)}.row4{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
/* KPIs */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin-bottom:14px}
.kpis.sm{grid-template-columns:repeat(auto-fit,minmax(140px,1fr));margin-bottom:6px}
.kpi{position:relative;overflow:hidden;background:linear-gradient(180deg,rgba(255,255,255,.04),rgba(255,255,255,.01)),var(--p);border:1px solid var(--b);border-radius:var(--rad);padding:13px 14px;min-width:0;box-shadow:var(--sh);transition:transform .15s,border-color .15s}
.kpi::before{content:"";position:absolute;inset-inline:0;top:0;height:2px;background:var(--grad);opacity:.75}
.kpi:hover{transform:translateY(-2px);border-color:var(--b2)}
.kl{color:var(--m);font-size:11.5px;text-transform:uppercase;letter-spacing:.05em}
.kv{font-size:21px;font-weight:700;display:flex;flex-direction:column;margin-top:3px}
.kv .n{font-family:var(--mono);letter-spacing:-.02em}
.ks{color:var(--m);font-size:12px;margin-top:3px}
.loc{font-size:11.5px;font-weight:400;color:var(--m);font-family:system-ui}
.n{direction:ltr;unicode-bidi:isolate;font-variant-numeric:tabular-nums}
.kv .n,.ks .n{display:block;text-align:start}
.pos{color:var(--g)}.neg{color:var(--r)}.muted{color:var(--m);font-size:12.5px}
.est{font-size:10.5px;color:var(--a);border:1px solid color-mix(in srgb,var(--a) 60%,transparent);border-radius:20px;padding:0 9px;letter-spacing:.06em}
.badge{display:inline-block;padding:1px 10px;border-radius:20px;font-size:11.5px;font-weight:650;border:1px solid var(--b)}
.b-ok,.r-win{color:var(--g);border-color:color-mix(in srgb,var(--g) 55%,transparent);background:color-mix(in srgb,var(--g) 10%,transparent)}
.b-adjusted,.r-be{color:var(--a);border-color:color-mix(in srgb,var(--a) 55%,transparent);background:color-mix(in srgb,var(--a) 10%,transparent)}
.b-blocked,.r-loss{color:var(--r);border-color:color-mix(in srgb,var(--r) 55%,transparent);background:color-mix(in srgb,var(--r) 10%,transparent)}
.r-open{color:var(--bl);border-color:color-mix(in srgb,var(--bl) 55%,transparent);background:color-mix(in srgb,var(--bl) 10%,transparent)}
.note{padding:9px 13px;border:1px solid var(--b);border-radius:12px;background:var(--p2);color:var(--m);font-size:12.5px;margin-bottom:14px}
.msgs{list-style:none;margin:6px 0;padding:0;display:flex;flex-direction:column;gap:5px}
.msgs li{padding:7px 11px;border-radius:10px;font-size:13px;border:1px solid var(--b)}
.msgs .err{border-color:color-mix(in srgb,var(--r) 60%,transparent);background:color-mix(in srgb,var(--r) 11%,transparent)}
.msgs .err::before{content:"✕ ";color:var(--r);font-weight:700}
.msgs .warn{border-color:color-mix(in srgb,var(--a) 60%,transparent);background:color-mix(in srgb,var(--a) 10%,transparent)}
.msgs .warn::before{content:"▲ ";color:var(--a)}
.msgs .ok{border-color:color-mix(in srgb,var(--g) 60%,transparent);background:color-mix(in srgb,var(--g) 9%,transparent)}
.msgs .ok::before{content:"✓ ";color:var(--g);font-weight:700}
/* tables */
.tw{overflow-x:auto}.tw.tall{max-height:560px;overflow-y:auto}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl caption{text-align:start;color:var(--m);font-size:12px;padding-bottom:6px;text-transform:uppercase;letter-spacing:.05em}
.tbl th,.tbl td{padding:7px 9px;border-bottom:1px solid var(--b);text-align:start;vertical-align:middle;white-space:nowrap}
.tbl tbody tr:hover{background:rgba(148,163,184,.06)}
.tbl th[scope=row]{font-weight:500;color:var(--m);white-space:normal}
.tbl td.n{text-align:end}
.tbl thead th{position:sticky;top:0;background:var(--p);font-size:11.5px;color:var(--m);z-index:1;text-transform:uppercase;letter-spacing:.04em}
.tbl tr.sum th,.tbl tr.sum td{border-top:1px solid var(--b2);font-weight:650;background:rgba(148,163,184,.05)}
.tbl td input,.tbl td select{padding:4px 7px;min-width:84px;font-size:12.5px;border-radius:8px}
.plan td input{min-width:92px}.jt td input[type=text]{min-width:140px}.jt td input[type=date]{min-width:128px}
tr.r-halted,tr.r-invalid,tr.r-paused{opacity:.55}tr.r-skip{opacity:.45}
tr.r-executed td:first-child{box-shadow:inset 3px 0 0 var(--ac)}
/* risk bar, meter */
.rbar{display:flex;height:34px;border-radius:11px;overflow:hidden;margin:6px 0 14px;font-size:12px;font-weight:700;color:#fff;box-shadow:0 8px 22px -14px rgba(0,0,0,.8)}
.rbar span{display:flex;align-items:center;justify-content:center;min-width:2px;overflow:hidden;white-space:nowrap;font-family:var(--mono)}
.rl{background:linear-gradient(90deg,#e11d48,#fb7185)}.rw{background:linear-gradient(90deg,#10b981,#34d399);color:#04201a}
.meter{height:7px;background:var(--p3);border-radius:7px;overflow:hidden;margin:6px 0}.meter i{display:block;height:100%;background:var(--grad);border-radius:7px}.meter i.hi{background:linear-gradient(90deg,#f59e0b,#fb7185)}
/* charts */
.chart{position:relative;direction:ltr}.chart svg{width:100%;height:auto;display:block}
.gl{stroke:var(--b);stroke-width:1;stroke-dasharray:2 4}.ax{fill:var(--m);font-size:10.5px;font-family:var(--mono)}.cross{stroke:var(--m);stroke-width:1;stroke-dasharray:3 3}
.chart path[fill=none]{filter:drop-shadow(0 3px 6px rgba(45,212,191,.25))}
.tipbox{position:absolute;pointer-events:none;background:var(--p3);border:1px solid var(--b2);border-radius:9px;padding:6px 10px;font-size:12px;white-space:nowrap;direction:ltr;z-index:2;box-shadow:var(--sh)}
.tipbox i,.legend i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-inline-end:6px}
.legend{display:flex;flex-wrap:wrap;gap:14px;margin-top:8px;font-size:12px;color:var(--m)}
.empty{padding:22px;text-align:center;color:var(--m)}
.tip-i{display:inline-flex;align-items:center;justify-content:center;width:15px;height:15px;margin-inline-start:6px;border:1px solid var(--m);border-radius:50%;font-size:10px;font-style:normal;color:var(--m);cursor:help}
#toast{position:fixed;bottom:20px;inset-inline:0;margin:auto;width:max-content;max-width:90vw;background:var(--p3);border:1px solid var(--ac);padding:9px 18px;border-radius:12px;opacity:0;transition:opacity .2s;pointer-events:none;box-shadow:var(--sh)}
#toast.show{opacity:1}
/* responsive */
@media (max-width:980px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .side{position:sticky;height:auto;flex-direction:row;flex-wrap:wrap;align-items:center;gap:8px 12px;padding:10px 12px;border-inline-end:0;border-bottom:1px solid var(--b);z-index:5;backdrop-filter:blur(10px)}
  .logo svg{width:34px;height:34px}.tools{margin-inline-start:auto}.tools button{flex:none}
  #nav{order:3;flex:1 0 100%;flex-direction:row;overflow-x:auto;gap:4px;padding-bottom:2px;scrollbar-width:none}
  #nav button{flex:0 0 auto;padding:8px 12px}#nav button.on::before{display:none}
  .wrap{padding:14px 12px 40px}
  .cols,#tab-calc>.cols,.cols3,#tab-calc .cols .cols{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:520px){.row3{grid-template-columns:1fr}.kv{font-size:18px}.brand span{display:none}#nav button span{font-size:12.5px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media print{.side,.btns,.banner{display:none}.shell{display:block}body{background:#fff}}
</style>
</head>
<body>
<div class="shell">
  <aside class="side">
    <div class="logo">
      <svg viewBox="0 0 48 48" aria-hidden="true"><defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2dd4bf"/><stop offset="1" stop-color="#6366f1"/></linearGradient></defs><rect width="48" height="48" rx="12" fill="url(#lg)"/><path d="M10 31l8-9 6 6 14-15" fill="none" stroke="#fff" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M30 13h8v8" fill="none" stroke="#fff" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <div class="brand"><b id="ttl"></b><span id="sub"></span></div>
    </div>
    <nav id="nav" role="tablist"></nav>
    <div class="tools"><button id="bLang" type="button"></button><button id="bTheme" type="button"></button></div>
  </aside>
  <div class="wrap">
    <div id="banner" class="banner" role="note"></div>
    <main id="main"></main>
  </div>
</div>
<div id="toast" role="status" aria-live="polite"></div>
<script>/* engine.js — Pro Risk & Reward calculation engine (pure functions, no DOM).
 * All percent-type inputs are in PERCENT units (1 = 1%). All results are ESTIMATES,
 * not actual exchange execution. */
(function (root, factory) {
  if (typeof module === 'object' && module.exports) module.exports = factory();
  else root.RRE = factory();
})(typeof self !== 'undefined' ? self : this, function () {
  'use strict';

  /* ---------- editable defaults (fees/funding/specs are PLACEHOLDERS, verify on exchange) ---------- */
  var DEFAULTS = {
    exchange: 'LBank', pair: 'BTC/USDT', marginMode: 'isolated',
    initialEquity: 45,
    fxRate: 12000000 / 45, fxUnit: 'toman', fxStamp: '',
    entryPrice: 100000,
    maxLeverage: 3, leverage: 3,
    riskPct: 1, maxDrawdownPct: 15,
    rr: 3, stopPct: 1, targetPct: 3,
    planTrades: 30, maxDailyTrades: 2, maxDailyLossPct: 2, maxConsecLosses: 0,
    makerFeePct: 0.02, takerFeePct: 0.06, slippagePct: 0.02,
    entryType: 'taker', tpType: 'maker', slType: 'taker',
    fundingRatePct: 0.01, fundingIntervalH: 8, holdHours: 8,
    qtyStep: 0.0001, minQty: 0.0001, minNotional: 0,
    mmrPct: 0.5,
    costsInRisk: true, capMode: 'cap',
    winRatePct: 35, mcPaths: 2000, seed: 12345, compoundMode: 'compound'
  };

  /* ---------- helpers ---------- */
  function num(x) {
    var v = typeof x === 'string' ? parseFloat(x) : x;
    return (typeof v === 'number' && isFinite(v)) ? v : NaN;
  }
  function nz(x) { var v = num(x); return isNaN(v) ? 0 : v; }
  function stepDecimals(step) {
    if (!(step > 0)) return 8;
    var d = 0, x = step;
    while (d < 12 && Math.abs(Math.round(x) - x) > 1e-9) { x *= 10; d++; }
    return d;
  }
  /* round DOWN to the permitted step (never up) */
  function floorTo(x, step) {
    if (!(x > 0) || !(step > 0)) return 0;
    var n = Math.floor(x / step * (1 + 1e-12) + 1e-12);
    return Number((n * step).toFixed(stepDecimals(step)));
  }
  function mulberry32(seed) {
    var a = (seed >>> 0) || 1;
    return function () {
      a = (a + 0x6D2B79F5) >>> 0;
      var t = a;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function percentile(sorted, q) {
    var n = sorted.length;
    if (!n) return NaN;
    if (n === 1) return sorted[0];
    var pos = (n - 1) * q, lo = Math.floor(pos), hi = Math.ceil(pos);
    return sorted[lo] + (sorted[hi] - sorted[lo]) * (pos - lo);
  }
  function toLocal(usd, rate) { return usd * rate; }
  function fromLocal(local, rate) { return rate > 0 ? local / rate : NaN; }

  /* ---------- funding estimate ----------
   * cost as a FRACTION of notional; positive = paid, negative = received.
   * Long pays when rate > 0, short receives (and vice-versa). Expected value over hold time. */
  function fundingFraction(side, ratePct, holdHours, intervalH) {
    var dir = side === 'short' ? -1 : 1;
    var periods = intervalH > 0 ? holdHours / intervalH : 0;
    return dir * (ratePct / 100) * periods;
  }

  /* ---------- core: position calculator ---------- */
  function invalid(errors, side) {
    return {
      ok: false, status: 'blocked', errors: errors, warnings: [], side: side,
      qty: 0, notional: 0, margin: 0, netLoss: 0, netWin: 0, grossRisk: 0, grossReward: 0,
      riskBudget: 0, isEstimate: true
    };
  }

  function computePosition(p) {
    var Er = [], W = [];
    var side = p.side === 'short' ? 'short' : 'long';
    var dir = side === 'long' ? 1 : -1;
    var E = num(p.equity), P = num(p.entry), L = num(p.leverage), maxL = num(p.maxLeverage);
    var init = num(p.initialEquity), maxDD = nz(p.maxDrawdownPct);

    if (!(E > 0)) Er.push('ERR_EQUITY');
    if (!(P > 0)) Er.push('ERR_ENTRY');
    if (!(L >= 1)) Er.push('ERR_LEV_MIN');
    else if (isFinite(maxL) && L > maxL) Er.push('ERR_LEV_CAP');

    var maker = num(p.makerFeePct), taker = num(p.takerFeePct), slip = nz(p.slippagePct);
    if (isNaN(maker)) maker = 0; if (isNaN(taker)) taker = 0;
    if (maker < 0 || taker < 0 || slip < 0) Er.push('ERR_COST');

    /* stop distance s (fraction) */
    var s = NaN;
    if (p.stopMode === 'price') {
      var sp = num(p.stopPrice);
      if (!(sp > 0)) Er.push('ERR_STOP');
      else {
        s = P > 0 ? dir * (P - sp) / P : NaN;
        if (!(s > 0)) Er.push('ERR_STOP_SIDE');
      }
    } else {
      s = num(p.stopPct) / 100;
      if (!(s > 0 && s < 1)) Er.push('ERR_STOP');
    }
    /* target distance t (fraction) */
    var t = NaN;
    if (p.targetMode === 'price') {
      var tp0 = num(p.targetPrice);
      if (!(tp0 > 0)) Er.push('ERR_TARGET');
      else {
        t = P > 0 ? dir * (tp0 - P) / P : NaN;
        if (!(t > 0)) Er.push('ERR_TARGET_SIDE');
      }
    } else if (p.targetMode === 'pct') {
      t = num(p.targetPct) / 100;
      if (!(t > 0)) Er.push('ERR_TARGET');
    } else {
      var rr = num(p.rr);
      if (!(rr > 0)) Er.push('ERR_RR'); else if (s > 0) t = s * rr;
    }
    if (side === 'short' && t >= 1) Er.push('ERR_TARGET');

    /* drawdown floor */
    var floor = isNaN(init) ? 0 : init * (1 - maxDD / 100);
    var buffer = E - floor;
    if (E > 0 && !isNaN(init) && buffer <= 1e-12) Er.push('ERR_DD_HALT');

    if (Er.length) return invalid(Er, side);

    /* cost model (fractions of notional) */
    var fEntry = (p.entryType === 'maker' ? maker : taker) / 100;
    var fTP = (p.tpType === 'taker' ? taker : maker) / 100;
    var fSL = (p.slType === 'maker' ? maker : taker) / 100;
    var sl = slip / 100;
    var slipEntry = p.entryType === 'maker' ? 0 : sl;
    var slipTP = p.tpType === 'taker' ? sl : 0;
    var slipSL = p.slType === 'maker' ? 0 : sl;
    var fund = fundingFraction(side, nz(p.fundingRatePct), nz(p.holdHours), nz(p.fundingIntervalH));

    var costStop = fEntry + fSL + slipEntry + slipSL;
    var costTP = fEntry + fTP + slipEntry + slipTP;
    var lossFrac = s + costStop + fund;     /* net loss per $ notional if SL hits */
    var winFrac = t - costTP - fund;        /* net gain per $ notional if TP hits */

    /* risk budget (clamped to remaining drawdown buffer — never silent) */
    var R0 = (p.riskBudgetUsd != null && isFinite(p.riskBudgetUsd)) ? num(p.riskBudgetUsd) : E * nz(p.riskPct) / 100;
    if (!(R0 > 0)) return invalid(['ERR_RISK'], side);
    var R = R0;
    if (!isNaN(init) && R0 > buffer) { R = buffer; W.push('WARN_RISK_CLAMPED_DD'); }

    var sizingLoss = p.costsInRisk === false ? s : s + costStop + Math.max(fund, 0);
    var N0 = R / sizingLoss;

    /* margin / leverage cap: margin + entry fee must fit in free balance */
    var free = (p.freeBalance != null && isFinite(p.freeBalance)) ? num(p.freeBalance) : E;
    var capN = Math.max(free, 0) / (1 / L + fEntry);
    var N1 = N0;
    if (N0 > capN + 1e-12) {
      if (p.capMode === 'block') Er.push('ERR_MARGIN');
      else { N1 = capN; W.push('WARN_CAPPED_MARGIN'); }
    }

    /* quantity: round DOWN to step */
    var step = num(p.qtyStep) > 0 ? num(p.qtyStep) : 1e-8;
    var Q = floorTo(N1 / P, step);
    var minQ = nz(p.minQty);
    if (!(Q > 0) || Q < minQ - 1e-15) {
      Er.push('ERR_MIN_QTY');
      /* risk was clamped to the remaining drawdown buffer and that buffer cannot fund a minimum order */
      if (W.indexOf('WARN_RISK_CLAMPED_DD') >= 0) Er.push('ERR_DD_BUFFER');
    }
    var Nq = Q * P;
    if (nz(p.minNotional) > 0 && Nq < p.minNotional) Er.push('ERR_MIN_NOTIONAL');
    if (Q > 0 && N1 > 0 && Nq < N1 * 0.9) W.push('WARN_ROUNDING_BIG');

    var margin = Nq / L;
    var grossRisk = Nq * s, grossReward = Nq * t;
    var netLoss = Nq * lossFrac, netWin = Nq * winFrac;
    if (netWin <= 0) W.push('WARN_NET_REWARD_NEG');
    if (netLoss > R * (1 + 1e-9) + 1e-12 && Nq > 0) W.push('WARN_RISK_OVER_BUDGET');

    /* liquidation estimate (isolated, simplified) */
    var mmr = nz(p.mmrPct) / 100;
    var liqDist = 1 / L - mmr;
    var liqPrice = P * (1 - dir * liqDist);
    if (!(liqDist > 0)) Er.push('ERR_STOP_BEYOND_LIQ');
    else if (s >= liqDist) Er.push('ERR_STOP_BEYOND_LIQ');
    else if (s > 0.5 * liqDist) W.push('WARN_LIQ_CLOSE');

    if (!isNaN(init) && E - netLoss < floor - 1e-9) W.push('WARN_BREACH_DD_FLOOR');

    var be = (netWin > 0 && netLoss > 0) ? netLoss / (netLoss + netWin) * 100 : (netLoss > 0 ? 100 : NaN);
    var status = Er.length ? 'blocked' : (W.some(function (w) { return w === 'WARN_CAPPED_MARGIN' || w === 'WARN_RISK_CLAMPED_DD'; }) ? 'adjusted' : 'ok');

    return {
      ok: Er.length === 0, status: status, errors: Er, warnings: W, isEstimate: true,
      side: side, entry: P, equity: E, leverage: L,
      slPrice: P * (1 - dir * s), tpPrice: P * (1 + dir * t),
      stopPct: s * 100, targetPct: t * 100, rrGross: t / s,
      riskBudget: R, riskBudgetRequested: R0,
      qty: Q, qtyUncapped: N0 / P, notional: Nq, notionalTarget: N1,
      margin: margin, effLeverage: Nq / E,
      liqPrice: liqPrice, liqDistPct: liqDist * 100,
      grossRisk: grossRisk, grossReward: grossReward,
      fees: { entry: Nq * fEntry, tp: Nq * fTP, sl: Nq * fSL },
      slippage: { entry: Nq * slipEntry, tp: Nq * slipTP, sl: Nq * slipSL },
      funding: Nq * fund,
      netLoss: netLoss, netWin: netWin,
      netRR: netLoss > 0 ? netWin / netLoss : NaN,
      breakevenWR: be,
      riskPctEquity: netLoss / E * 100,
      costs: { loss: netLoss - grossRisk, win: grossReward - netWin },
      floor: floor, buffer: buffer
    };
  }

  /* ---------- guards ---------- */
  function streaks(pnls) {
    var maxW = 0, maxL = 0, cw = 0, cl = 0;
    for (var i = 0; i < pnls.length; i++) {
      if (pnls[i] > 0) { cw++; cl = 0; if (cw > maxW) maxW = cw; }
      else if (pnls[i] < 0) { cl++; cw = 0; if (cl > maxL) maxL = cl; }
      else { cw = 0; cl = 0; }
    }
    return { maxWin: maxW, maxLoss: maxL, currentLoss: cl, currentWin: cw };
  }

  /* st: {equity, initialEquity, tradesToday, pnlToday, dayStartEquity, consecLosses} */
  function checkGuards(s, st) {
    var reasons = [];
    var floor = st.initialEquity * (1 - s.maxDrawdownPct / 100);
    if (st.equity <= floor + 1e-9) reasons.push('GUARD_DD');
    if (st.tradesToday >= s.maxDailyTrades) reasons.push('GUARD_DAILY_TRADES');
    var ds = st.dayStartEquity > 0 ? st.dayStartEquity : st.equity;
    if (s.maxDailyLossPct > 0 && -st.pnlToday >= s.maxDailyLossPct / 100 * ds - 1e-9) reasons.push('GUARD_DAILY_LOSS');
    if (s.maxConsecLosses > 0 && st.consecLosses >= s.maxConsecLosses) reasons.push('GUARD_CONSEC');
    return { allowed: reasons.length === 0, reasons: reasons };
  }

  /* ---------- outcome generators ---------- */
  function evenOutcomes(n, winRatePct) {
    var w = Math.round(n * winRatePct / 100), out = [];
    for (var i = 0; i < n; i++) out.push(Math.floor((i + 1) * w / n) > Math.floor(i * w / n) ? 'win' : 'loss');
    return out;
  }
  function seededOutcomes(n, winRatePct, seed) {
    var rnd = mulberry32(seed), out = [];
    for (var i = 0; i < n; i++) out.push(rnd() < winRatePct / 100 ? 'win' : 'loss');
    return out;
  }
  function sideFor(i, mode) { return mode === 'long' ? 'long' : mode === 'short' ? 'short' : (i % 2 === 0 ? 'long' : 'short'); }

  /* ---------- sequential trade planner ----------
   * rows: [{side, outcome: win|loss|pending|skip, entry?}] ; mode: compound | fixed */
  function runPlan(s, rows, opts) {
    opts = opts || {};
    var mode = opts.mode || s.compoundMode || 'compound';
    var init = s.initialEquity, floor = init * (1 - s.maxDrawdownPct / 100);
    var E = init, peak = init, day = 1, dayTrades = 0, dayStart = E, dayPnl = 0, consec = 0, halted = false;
    var out = [], curve = [init], pnls = [];
    var wins = 0, losses = 0, grossSum = 0, costSum = 0, maxDDp = 0, executed = 0;
    var q = Object.assign({}, s);

    for (var i = 0; i < rows.length; i++) {
      var r = rows[i];
      var row = { i: i + 1, side: r.side === 'short' ? 'short' : 'long', outcome: r.outcome, entry: r.entry > 0 ? r.entry : s.entryPrice };
      if (r.outcome === 'skip') { row.status = 'skip'; row.eqBefore = E; row.eqAfter = E; out.push(row); continue; }
      if (halted || E <= floor + 1e-9) { halted = true; row.status = 'halted'; row.eqBefore = E; row.eqAfter = E; out.push(row); continue; }

      if (dayTrades >= s.maxDailyTrades) { day++; dayTrades = 0; dayStart = E; dayPnl = 0; }
      if (s.maxDailyLossPct > 0 && -dayPnl >= s.maxDailyLossPct / 100 * dayStart - 1e-9) { day++; dayTrades = 0; dayStart = E; dayPnl = 0; }
      if (s.maxConsecLosses > 0 && consec >= s.maxConsecLosses) {
        row.status = 'paused'; row.eqBefore = E; row.eqAfter = E; consec = 0; out.push(row); continue;
      }

      q.side = row.side; q.entry = row.entry; q.equity = E; q.freeBalance = E;
      q.stopMode = 'pct'; q.targetMode = 'rr';
      q.riskBudgetUsd = mode === 'fixed' ? init * s.riskPct / 100 : null;
      var pos = computePosition(q);
      row.day = day; row.eqBefore = E;
      if (!pos.ok) {
        row.status = (pos.errors.indexOf('ERR_DD_HALT') >= 0 || pos.errors.indexOf('ERR_DD_BUFFER') >= 0) ? 'halted' : 'invalid';
        if (row.status === 'halted') halted = true;
        row.errors = pos.errors; row.eqAfter = E; out.push(row); continue;
      }
      row.qty = pos.qty; row.notional = pos.notional; row.margin = pos.margin;
      row.risk = pos.netLoss; row.reward = pos.netWin; row.warnings = pos.warnings;
      dayTrades++;
      if (r.outcome === 'win' || r.outcome === 'loss') {
        var win = r.outcome === 'win';
        row.gross = win ? pos.grossReward : -pos.grossRisk;
        row.costs = win ? pos.costs.win : pos.costs.loss;
        row.pnl = win ? pos.netWin : -pos.netLoss;
        E += row.pnl; dayPnl += row.pnl;
        if (win) { wins++; consec = 0; } else { losses++; consec++; }
        grossSum += row.gross; costSum += row.costs; executed++; pnls.push(row.pnl);
        row.status = 'executed';
      } else { row.status = 'pending'; row.pnl = 0; row.gross = 0; row.costs = 0; }
      if (E > peak) peak = E;
      row.eqAfter = E;
      row.ddPeakPct = (peak - E) / peak * 100;
      row.ddInitPct = Math.max(0, (init - E) / init * 100);
      if (row.ddPeakPct > maxDDp) maxDDp = row.ddPeakPct;
      curve.push(E);
      out.push(row);
    }
    return {
      rows: out, curve: curve, pnls: pnls, floor: floor, halted: halted,
      summary: {
        finalEquity: E, peak: peak, netPnl: E - init, returnPct: (E / init - 1) * 100,
        maxDDPct: maxDDp, executed: executed, wins: wins, losses: losses,
        winRate: executed ? wins / executed * 100 : NaN,
        gross: grossSum, costs: costSum, days: day
      }
    };
  }

  /* ---------- analytics ---------- */
  function analyze(pnls, curve) {
    var n = pnls.length, wins = 0, losses = 0, gw = 0, gl = 0;
    for (var i = 0; i < n; i++) {
      if (pnls[i] > 0) { wins++; gw += pnls[i]; } else if (pnls[i] < 0) { losses++; gl += -pnls[i]; }
    }
    var avgWin = wins ? gw / wins : 0, avgLoss = losses ? gl / losses : 0;
    var wr = n ? wins / n : NaN;
    var exp = n ? (gw - gl) / n : NaN;
    var peak = -Infinity, mdd = 0, mddUsd = 0;
    (curve || []).forEach(function (v) {
      if (v > peak) peak = v;
      var d = peak > 0 ? (peak - v) / peak * 100 : 0;
      if (d > mdd) mdd = d;
      if (peak - v > mddUsd) mddUsd = peak - v;
    });
    return {
      n: n, wins: wins, losses: losses, winRate: wr * 100,
      avgWin: avgWin, avgLoss: avgLoss, payoff: avgLoss > 0 ? avgWin / avgLoss : NaN,
      expectancy: exp, expectancyR: avgLoss > 0 ? exp / avgLoss : NaN,
      profitFactor: gl > 0 ? gw / gl : (gw > 0 ? Infinity : NaN),
      grossWins: gw, grossLosses: gl, net: gw - gl,
      maxDDPct: mdd, maxDDUsd: mddUsd, streaks: streaks(pnls)
    };
  }

  /* theoretical expectancy from win rate and per-trade net win/loss (USD) */
  function theoretical(winRatePct, netWin, netLoss) {
    var p = winRatePct / 100;
    var e = p * netWin - (1 - p) * netLoss;
    return {
      expectancy: e,
      expectancyR: netLoss > 0 ? e / netLoss : NaN,
      breakevenWR: (netWin + netLoss) > 0 ? netLoss / (netWin + netLoss) * 100 : NaN,
      profitFactor: (1 - p) * netLoss > 0 ? p * netWin / ((1 - p) * netLoss) : Infinity
    };
  }

  /* ---------- compound / fixed growth projection (expected values) ---------- */
  function growthProjection(o) {
    var r = o.riskPct / 100, p = o.winRatePct / 100, R = o.netRR, n = o.n;
    var m = r * (p * R - (1 - p));               /* mean return per trade as fraction of base */
    var g = (1 + r * R > 0 && 1 - r > 0) ? p * Math.log(1 + r * R) + (1 - p) * Math.log(1 - r) : NaN;
    var comp = [], fixed = [], typical = [];
    for (var k = 0; k <= n; k++) {
      comp.push(o.initial * Math.pow(1 + m, k));
      fixed.push(o.initial * (1 + k * m));
      typical.push(o.initial * Math.exp(k * g));
    }
    return { expectedCompound: comp, expectedFixed: fixed, typicalGeometric: typical, meanPerTrade: m, logGrowth: g };
  }

  /* ---------- Monte Carlo (hypothetical, seeded, reproducible) ---------- */
  function monteCarlo(s, o) {
    var paths = Math.max(1, Math.min(50000, Math.floor(o.paths || s.mcPaths || 2000)));
    var T = Math.max(1, Math.floor(o.trades || s.planTrades));
    var wr = (o.winRatePct != null ? o.winRatePct : s.winRatePct) / 100;
    var mode = o.mode || s.compoundMode || 'compound';
    var seed = o.seed != null ? o.seed : s.seed;
    var sideMode = o.sideMode || 'alternate';
    var rnd = mulberry32(seed);
    var init = s.initialEquity, floor = init * (1 - s.maxDrawdownPct / 100);
    var q = Object.assign({}, s, { stopMode: 'pct', targetMode: 'rr', entry: o.entry > 0 ? o.entry : s.entryPrice });
    var matrix = [], finals = [], maxDDs = [], lossStreaks = [], halts = 0, skipped = 0, profitable = 0;

    for (var pI = 0; pI < paths; pI++) {
      var E = init, peak = init, mdd = 0, curve = new Array(T + 1), halted = false, cl = 0, ml = 0;
      curve[0] = E;
      for (var t = 0; t < T; t++) {
        if (!halted && E <= floor + 1e-9) { halted = true; halts++; }
        var win = rnd() < wr;   /* always draw, keeps sequences comparable across settings */
        if (!halted) {
          q.side = sideFor(t, sideMode); q.equity = E; q.freeBalance = E;
          q.riskBudgetUsd = mode === 'fixed' ? init * s.riskPct / 100 : null;
          var pos = computePosition(q);
          if (pos.ok) {
            E += win ? pos.netWin : -pos.netLoss;
            if (win) cl = 0; else { cl++; if (cl > ml) ml = cl; }
          } else if (pos.errors.indexOf('ERR_DD_HALT') >= 0 || pos.errors.indexOf('ERR_DD_BUFFER') >= 0) {
            halted = true; halts++;
          } else skipped++;
          if (E > peak) peak = E;
          var d = (peak - E) / peak * 100; if (d > mdd) mdd = d;
        }
        curve[t + 1] = E;
      }
      if (!halted && E <= floor + 1e-9) { halted = true; halts++; }
      matrix.push(curve); finals.push(E); maxDDs.push(mdd); lossStreaks.push(ml);
      if (E > init) profitable++;
    }
    var sf = finals.slice().sort(function (a, b) { return a - b; });
    var sd = maxDDs.slice().sort(function (a, b) { return a - b; });
    var sl = lossStreaks.slice().sort(function (a, b) { return a - b; });
    var pc = function (arr, q2) { return percentile(arr, q2); };
    var bands = { p5: [], p25: [], p50: [], p75: [], p95: [] };
    var col = new Array(paths);
    for (var k = 0; k <= T; k++) {
      for (var j = 0; j < paths; j++) col[j] = matrix[j][k];
      col.sort(function (a, b) { return a - b; });
      bands.p5.push(pc(col, 0.05)); bands.p25.push(pc(col, 0.25)); bands.p50.push(pc(col, 0.5));
      bands.p75.push(pc(col, 0.75)); bands.p95.push(pc(col, 0.95));
    }
    var lo = sf[0], hi = sf[sf.length - 1], nb = 20, w = (hi - lo) / nb || 1, hist = [];
    for (var b = 0; b < nb; b++) hist.push({ from: lo + b * w, to: lo + (b + 1) * w, count: 0 });
    finals.forEach(function (v) { var idx = Math.min(nb - 1, Math.floor((v - lo) / w)); hist[idx].count++; });
    var mean = finals.reduce(function (a, b2) { return a + b2; }, 0) / paths;
    return {
      hypothetical: true, paths: paths, trades: T, winRatePct: wr * 100, mode: mode, seed: seed,
      pct: { p5: pc(sf, 0.05), p25: pc(sf, 0.25), p50: pc(sf, 0.5), p75: pc(sf, 0.75), p95: pc(sf, 0.95) },
      mean: mean, min: lo, max: hi,
      probProfit: profitable / paths * 100, probHalt: halts / paths * 100,
      medianMaxDD: pc(sd, 0.5), p95MaxDD: pc(sd, 0.95), medianLossStreak: pc(sl, 0.5), maxLossStreak: sl[sl.length - 1],
      skippedTrades: skipped, bands: bands, hist: hist, floor: floor

  }

  /* ---------- CSV (RFC4180-ish, spreadsheet-formula-injection safe) ---------- */
  function csvCell(v) {
    if (v == null) return '';
    var s2 = typeof v === 'number' ? (isFinite(v) ? String(v) : '') : String(v);
    if (typeof v === 'string' && /^[=+\-@\t\r]/.test(s2)) s2 = "'" + s2;
    if (/[",\r\n]/.test(s2)) s2 = '"' + s2.replace(/"/g, '""') + '"';
    return s2;
  }
  function toCSV(rows, cols) {
    var lines = [cols.map(function (c) { return csvCell(c.label); }).join(',')];
    rows.forEach(function (r) { lines.push(cols.map(function (c) { return csvCell(r[c.key]); }).join(',')); });
    return lines.join('\r\n');
  }

  return {
    DEFAULTS: DEFAULTS, num: num, floorTo: floorTo, stepDecimals: stepDecimals, mulberry32: mulberry32,
    percentile: percentile, toLocal: toLocal, fromLocal: fromLocal, fundingFraction: fundingFraction,
    computePosition: computePosition, checkGuards: checkGuards, streaks: streaks,
    evenOutcomes: evenOutcomes, seededOutcomes: seededOutcomes, sideFor: sideFor,
    runPlan: runPlan, analyze: analyze, theoretical: theoretical,
    growthProjection: growthProjection, monteCarlo: monteCarlo, toCSV: toCSV
  };
});

function renderJournal() {

  if (!J.length) h += '<div class="card empty">' + T('j_empty') + '</div>';
  else h += '<div class="card"><div class="tw tall"><table class="tbl jt"><thead><tr>' +
    [T('j_date'), T('r_side'), T('r_entry'), T('r_sl'), T('r_tp'), T('r_qty'), T('f_leverage'), T('j_exit'), T('j_fees'), T('j_funding'), T('j_risk'), T('p_pnl'), T('j_result'), 'R', T('j_notes'), ''].map(function (x) { return '<th>' + x + '</th>'; }).join('') +
    '</tr></thead><tbody>' + rows.map(jRowHtml).join('') + '</tbody></table></div></div>';

function refreshJournalRow(id) {

  var x = jCellsHtml(jCalc(r));

  $('#jsum').innerHTML = jSummaryHtml();
}
var JCOLS = [['id', 'id'], ['date', 'date'], ['side', 'side'], ['entry', 'entry'], ['stop', 'stop'], ['target', 'target'], ['qty', 'qty_btc'], ['leverage', 'leverage'], ['exit', 'exit'], ['fees_used', 'fees_usdt'],
  ['fees_est', 'fees_estimated'], ['funding', 'funding_usdt'], ['risk', 'planned_net_risk_usdt'], ['gross', 'gross_pnl_usdt'], ['net', 'net_pnl_usdt'], ['result', 'result'], ['r', 'r_multiple'], ['notes', 'notes']];

}

    ['i', 'trade'], ['day', 'day'], ['side', 'side'], ['outcome', 'outcome'], ['status', 'status'], ['entry', 'entry'], ['qty', 'qty_btc'], ['notional', 'notional_usdt'], ['margin', 'margin_usdt'],

/* ---------- Settings ---------- */
function renderSettings() {
  var h = '<div class="card"><h2>' + T('h_validation') + '</h2><ul class="msgs">';
  var bad = false, add = function (c, t) { bad = true; h += '<li class="' + c + '">' + T(t) + '</li>'; };

/* app3.js — events, sync, init */
function applyShow() {
  $$('[data-show]').forEach(function (el) { var p = el.dataset.show.split('='); el.hidden = String(S[p[0]]) !== p[1]; });
}
function syncInputs() {
  $$('[data-k]').forEach(function (el) {
    if (el === document.activeElement) return;
    var v = S[el.dataset.k];
    if (el.type === 'checkbox') el.checked = !!v; else el.value = v == null ? '' : v;
  });
  $$('[data-seg]').forEach(function (g) {
    $$('button', g).forEach(function (b) { var on = String(S[g.dataset.seg]) === b.dataset.v; b.setAttribute('aria-pressed', String(on)); b.classList.toggle('on', on); });
  });

}
var RENDER = { overview: renderOverview, calc: renderCalc, planner: renderPlanner, sim: renderSim, analytics: renderAnalytics, journal: renderJournal, settings: renderSettings };
function renderActive() {
  TABS.forEach(function (t) {

    var b = $('#nt-' + t); b.setAttribute('aria-selected', String(t === S.tab)); b.setAttribute('tabindex', t === S.tab ? '0' : '-1'); b.classList.toggle('on', t === S.tab);
  });

}
function dl(name, text) {
  var b = new Blob(['﻿' + text], { type: 'text/csv;charset=utf-8' }), a = document.createElement('a');
  a.href = URL.createObjectURL(b); a.download = name; document.body.appendChild(a); a.click();
  setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 500);
}
var ACTS = {
  fillEven: function () { ensurePlan(); var o = R.evenOutcomes(PL.length, +S.winRatePct); PL.forEach(function (r, i) { r.outcome = o[i]; }); sv('PL', PL); renderPlanner(); },
  fillRand: function () { ensurePlan(); var o = R.seededOutcomes(PL.length, +S.winRatePct, parseInt(S.seed, 10) || 1); PL.forEach(function (r, i) { r.outcome = o[i]; }); sv('PL', PL); renderPlanner(); },
  clearPlan: function () { PL.forEach(function (r) { r.outcome = 'pending'; }); sv('PL', PL); renderPlanner(); },
  resetSides: function () { PL.forEach(function (r, i) { r.side = R.sideFor(i, S.planSide); }); sv('PL', PL); renderPlanner(); },
  exportPlan: function () { dl('trade-plan-' + todayStr() + '.csv', planCsv()); },
  runSim: runSim,
  addTrade: function () {
    J.unshift({ id: uid(), date: todayStr(), side: 'long', entry: S.entryPrice, stop: '', target: '', qty: '', leverage: S.leverage, exit: '', fees: '', funding: '', risk: '', notes: '' });
    sv('J', J); renderJournal();
  },
  saveCalc: function () {
    var a = account(), pos = calcPos(a); if (!pos.ok) return;
    var g = guardState(a);
    if (!g.allowed && !confirm(T('guard_confirm') + '\n' + g.reasons.map(T).join('\n'))) return;
    J.unshift({ id: uid(), date: todayStr(), side: pos.side, entry: pos.entry, stop: +pos.slPrice.toFixed(2), target: +pos.tpPrice.toFixed(2), qty: pos.qty, leverage: pos.leverage, exit: '', fees: '', funding: '', risk: +pos.netLoss.toFixed(4), notes: '' });
    sv('J', J); toast(T('saved'));
  },
  exportJ: function () { dl('trade-journal-' + todayStr() + '.csv', journalCsv()); },
  clearJ: function () { if (confirm(T('confirm_clear'))) { J = []; sv('J', J); renderJournal(); } },
  resetDefaults: function () {
    if (!confirm(T('confirm_reset'))) return;
    S = Object.assign({}, D, UIDEF, { lang: S.lang, theme: S.theme, tab: S.tab }); PL = []; SIM = null; saveAll(); buildAll(); renderActive();
  }
};

document.addEventListener('input', function (e) {
  var el = e.target, d = el.dataset; if (!d) return;
  if (d.k) {
    var v;
    if (el.type === 'checkbox') v = el.checked; else if (el.type === 'number' || d.num) v = el.value === '' ? '' : parseFloat(el.value); else v = el.value;
    if (d.k === 'fxUnit' && v !== S.fxUnit && isn(+S.fxRate)) S.fxRate = v === 'rial' ? S.fxRate * 10 : S.fxRate / 10;
    S[d.k] = v; sv('S', S);
    if (d.k === 'fxUnit') buildAll();

  }
  if (d.sp === 'capLocal') {
    var L = parseFloat(el.value);
    if (L > 0 && +S.initialEquity > 0) { S.fxRate = L / S.initialEquity; sv('S', S); var fx = $('[data-k="fxRate"]'); if (fx) fx.value = S.fxRate; renderSettings(); }
  }
});
document.addEventListener('change', function (e) {
  var el = e.target, d = el.dataset; if (!d) return;

    var r = J.filter(function (x) { return x.id === d.j; })[0]; if (!r) return;
    r[d.f] = el.type === 'number' ? (el.value === '' ? '' : parseFloat(el.value)) : el.value;

  }

});
document.addEventListener('click', function (e) {

  if (b.dataset.del) { if (confirm(T('confirm_del'))) { J = J.filter(function (x) { return x.id !== b.dataset.del; }); sv('J', J); renderJournal(); } return; }

});
document.addEventListener('keydown', function (e) {

  var px = CL + (m.n > 1 ? i / (m.n - 1) : 0) * (CW - CL - CR), cr = $('.cross', c);

});
$('#bLang').addEventListener('click', function () { S.lang = S.lang === 'fa' ? 'en' : 'fa'; sv('S', S); buildAll(); renderActive(); });

if (TABS.indexOf(S.tab) < 0) S.tab = 'overview';
ensurePlan(); buildAll(); renderActive();
